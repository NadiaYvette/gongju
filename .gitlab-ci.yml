# GitLab CI configuration for Gachi (Framagit, Disroot)

stages:
  - verify

tagref-check:
  stage: verify
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y curl git python3
    - mkdir -p /usr/local/bin
    - PREFIX=/usr/local/bin curl https://raw.githubusercontent.com/stepchowfun/tagref/main/install.sh -LSfs | sh
  script:
    - ./bin/gongju-tagref
    - ./bin/gongju-linkcheck
    - ./bin/gongju-cloc --check
